databaseChangeLog:
  - changeSet:
      id: create_bookings_table
      author: postgres
      changes:
        - createTable:
            tableName: bookings
            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: ticket_count
                  type: integer
                  constraints:
                    nullable: false
              - column:
                  name: confirmed
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: expiry_time
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: event_id
                  type: bigint
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: bookings
            baseColumnNames: user_id
            constraintName: fk_booking_user
            referencedTableName: users
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: bookings
            baseColumnNames: event_id
            constraintName: fk_booking_event
            referencedTableName: events
            referencedColumnNames: id